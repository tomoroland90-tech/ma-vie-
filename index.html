<meta charset="UTF-8">

<title>Roland Tomo - Site Personnel</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #0A221A;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== BARRE CENTRÉE 2026 ===== */
  .nav-2026 {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-island {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(18, 45, 36, 0.85);
    border: 1px solid rgba(245, 242, 237, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 8px;
    border-radius: 999px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .nav-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn-pill {
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid transparent;
    letter-spacing: 0.02em;
  }
  .btn-ghost {
    background: transparent;
    color: #F5F2ED;
    border-color: #2A4A3D;
  }
  .btn-ghost:hover {
    background: rgba(245,242,237,0.08);
    border-color: rgba(245,242,237,0.25);
    transform: translateY(-1px);
  }
  .btn-solid {
    background: #E8E6D9;
    color: #0A221A;
    font-weight: 600;
  }
  .btn-solid:hover {
    background: #C8E6A0;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(200,230,160,0.3);
  }

  /* Contenu vide pour pousser le footer en bas */
  .content {
    flex: 1;
  }

  /* ===== FOOTER EN BAS DE PAGE ===== */
  .social-footer {
    background: #0A221A;
    border-top: 1px solid #1E3D32;
    padding: 40px 20px 30px;
    text-align: center;
    margin-top: auto;
  }
  .social-footer p {
    color: #8BA99E;
    font-size: 11px;
    margin: 0 0 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .social-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .social-icons a {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .social-icons a:hover {
    transform: translateY(-4px) scale(1.06);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .social-icons svg { width: 22px; height: 22px; fill: #fff; }
  .instagram { background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .facebook { background: #1877F2; }
  .telegram { background: #26A5E4; }
  .gmail { background: #ffffff; }
  .whatsapp { background: #25D366; }
  .snapchat { background: #FFFC00; }
  .snapchat svg { fill: #000 !important; }
  .tiktok { background: #010101; border: 1px solid #222; }
  .social-footer .copy {
    margin-top: 24px;
    color: #5A7A6E;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
  }
  @media (max-width: 480px) {
    .nav-island { padding: 6px; }
    .btn-pill { padding: 8px 16px; font-size: 12px; }
    .social-icons { gap: 10px; }
    .social-icons a { width: 44px; height: 44px; }
  }
</style>
</head>
